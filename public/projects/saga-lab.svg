<svg xmlns="http://www.w3.org/2000/svg" width="902" height="594" viewBox="0 0 902 594">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4CA9FF"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3BF686"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#FF6B6B"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#FFB84C"/>
    </marker>
  </defs>
  <rect width="902" height="594" fill="#1E1F26"/>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <!-- Services, each with its own database -->
    <rect x="76" y="34" width="180" height="72" rx="12" fill="#323443" stroke="#4CA9FF" stroke-width="2"/>
    <text x="166" y="68" fill="#FFFFFF" font-size="22" font-weight="700">Order</text>
    <text x="166" y="90" fill="#A0A0A0" font-size="12">SQLite</text>
    <rect x="361" y="34" width="180" height="72" rx="12" fill="#323443" stroke="#3BF686" stroke-width="2"/>
    <text x="451" y="68" fill="#FFFFFF" font-size="22" font-weight="700">Inventory</text>
    <text x="451" y="90" fill="#A0A0A0" font-size="12">SQLite</text>
    <rect x="646" y="34" width="180" height="72" rx="12" fill="#323443" stroke="#FF6B6B" stroke-width="2"/>
    <text x="736" y="68" fill="#FFFFFF" font-size="22" font-weight="700">Payment</text>
    <text x="736" y="90" fill="#A0A0A0" font-size="12">SQLite</text>

    <!-- Outcome sections -->
    <rect x="40" y="220" width="822" height="112" rx="10" fill="#3BF686" fill-opacity="0.04" stroke="#3BF686" stroke-opacity="0.4" stroke-dasharray="6 4"/>
    <rect x="40" y="346" width="822" height="196" rx="10" fill="#FF6B6B" fill-opacity="0.04" stroke="#FF6B6B" stroke-opacity="0.4" stroke-dasharray="6 4"/>

    <!-- Lifelines -->
    <g stroke="#3F4152" stroke-width="2" stroke-dasharray="4 6">
      <line x1="166" y1="108" x2="166" y2="558"/>
      <line x1="451" y1="108" x2="451" y2="558"/>
      <line x1="736" y1="108" x2="736" y2="558"/>
    </g>

    <!-- Section labels -->
    <rect x="40" y="220" width="112" height="22" rx="6" fill="#1E1F26"/>
    <rect x="40" y="220" width="112" height="22" rx="6" fill="#3BF686" fill-opacity="0.18"/>
    <text x="96" y="235" fill="#3BF686" font-size="11" font-weight="600">payment success</text>
    <rect x="40" y="346" width="112" height="22" rx="6" fill="#1E1F26"/>
    <rect x="40" y="346" width="112" height="22" rx="6" fill="#FF6B6B" fill-opacity="0.18"/>
    <text x="96" y="361" fill="#FF6B6B" font-size="11" font-weight="600">payment failed</text>

    <!-- Events, in order -->
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <line x1="168" y1="146" x2="449" y2="146" stroke="#4CA9FF" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <text x="308" y="136" fill="#4CA9FF">1  order-created</text>

      <line x1="449" y1="196" x2="168" y2="196" stroke="#3BF686" stroke-width="2" marker-end="url(#arrow-green)"/>
      <line x1="453" y1="196" x2="734" y2="196" stroke="#3BF686" stroke-width="2" marker-end="url(#arrow-green)"/>
      <text x="308" y="186" fill="#3BF686">2  stock-reserved</text>
      <text x="593" y="186" fill="#3BF686">2  stock-reserved</text>

      <line x1="734" y1="266" x2="168" y2="266" stroke="#3BF686" stroke-width="2" marker-end="url(#arrow-green)"/>
      <text x="593" y="256" fill="#3BF686">3  payment-success</text>

      <line x1="734" y1="392" x2="168" y2="392" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrow-red)"/>
      <text x="593" y="382" fill="#FF6B6B">3  payment-failed</text>

      <line x1="168" y1="446" x2="449" y2="446" stroke="#FFB84C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
      <text x="308" y="436" fill="#FFB84C">4  release-stock</text>
      <text x="308" y="466" fill="#FFB84C" font-size="11" opacity="0.8">compensation</text>
    </g>

    <!-- End states (solid backing hides the lifelines behind the pills) -->
    <rect x="91" y="286" width="150" height="28" rx="14" fill="#1E1F26"/>
    <rect x="91" y="286" width="150" height="28" rx="14" fill="#3BF686" fill-opacity="0.15" stroke="#3BF686"/>
    <text x="166" y="305" fill="#3BF686" font-size="13" font-weight="600">order confirmed</text>

    <rect x="96" y="494" width="140" height="28" rx="14" fill="#1E1F26"/>
    <rect x="96" y="494" width="140" height="28" rx="14" fill="#FF6B6B" fill-opacity="0.15" stroke="#FF6B6B"/>
    <text x="166" y="513" fill="#FF6B6B" font-size="13" font-weight="600">order failed</text>
    <rect x="371" y="494" width="160" height="28" rx="14" fill="#1E1F26"/>
    <rect x="371" y="494" width="160" height="28" rx="14" fill="#FFB84C" fill-opacity="0.15" stroke="#FFB84C"/>
    <text x="451" y="513" fill="#FFB84C" font-size="13" font-weight="600">stock restored</text>
  </g>
</svg>
